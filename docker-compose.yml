services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: citecheck
      POSTGRES_PASSWORD: citecheck
      POSTGRES_DB: citecheck
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citecheck"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    # AOF so the API response cache survives restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  grobid:
    # CRF-only image: native arm64 + amd64, ~0.5 GB. See DECISIONS.md.
    image: lfoppiano/grobid:0.9.1-crf
    ports: ["8070:8070"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8070/api/isalive || exit 1"]
      interval: 5s
      retries: 60

volumes:
  pgdata:
  redisdata:
